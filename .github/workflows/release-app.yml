name: Publish APK release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: apk-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out tagged files
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test release and website helpers
        run: node --test
      - name: Verify assets and publish release
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        with:
          script: |
            const path = require('node:path');
            const { pathToFileURL } = require('node:url');
            const moduleUrl = pathToFileURL(path.join(process.env.GITHUB_WORKSPACE, 'scripts', 'release.mjs'));
            const { publishRelease } = await import(moduleUrl.href);
            const url = await publishRelease(github, {
              ...context.repo,
              tag: process.env.RELEASE_TAG
            }, path.join(process.env.GITHUB_WORKSPACE, 'resources', 'app'));
            core.notice(`Published APK release: ${url}`);
