name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out current website
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test release and website helpers
        run: node --test
      - name: Read latest published release
        uses: actions/github-script@v7
        env:
          RELEASE_METADATA: ${{ runner.temp }}/release.json
        with:
          script: |
            const fs = require('node:fs');
            let release = null;
            try {
              release = (await github.rest.repos.getLatestRelease(context.repo)).data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            fs.writeFileSync(process.env.RELEASE_METADATA, JSON.stringify(release));
      - name: Prepare website download links
        run: node scripts/prepare-site.mjs "$RUNNER_TEMP/release.json" "$RUNNER_TEMP/published-site"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/published-site
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
