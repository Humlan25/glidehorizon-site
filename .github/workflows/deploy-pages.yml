name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Publish APK release]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Defer APK updates until release publication
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          deploy=true
          if [ "$EVENT_NAME" = push ]; then
            before="$BEFORE_SHA"
            if [ "$before" = 0000000000000000000000000000000000000000 ]; then
              before=$(git hash-object -t tree /dev/null)
            fi
            changed=$(git diff --name-only "$before" "$GITHUB_SHA" -- resources/app/GlideHorizon.apk resources/app/GlideHorizon.apk.sha256)
            if [ -n "$changed" ]; then
              echo "APK assets changed; the successful release workflow will trigger Pages."
              deploy=false
            fi
          fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
  deploy:
    needs: check
    if: needs.check.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out current website
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test release and website helpers
        run: node --test
      - name: Read latest published release
        uses: actions/github-script@v7
        env:
          RELEASE_METADATA: ${{ runner.temp }}/release.json
        with:
          script: |
            const fs = require('node:fs');
            let release = null;
            try {
              release = (await github.rest.repos.getLatestRelease(context.repo)).data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            fs.writeFileSync(process.env.RELEASE_METADATA, JSON.stringify(release));
      - name: Prepare website download links
        run: node scripts/prepare-site.mjs "$RUNNER_TEMP/release.json" "$RUNNER_TEMP/published-site"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: ${{ runner.temp }}/published-site
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Verify live download page
        uses: actions/github-script@v7
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          PUBLISHED_SITE: ${{ runner.temp }}/published-site
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const expected = fs.readFileSync(path.join(process.env.PUBLISHED_SITE, 'downloads.html'), 'utf8');
            const url = new URL('downloads.html', process.env.PAGE_URL);
            for (let attempt = 1; attempt <= 18; attempt++) {
              url.searchParams.set('deployment', `${context.runId}-${process.env.GITHUB_RUN_ATTEMPT}-${attempt}`);
              const response = await fetch(url, {
                headers: { 'Cache-Control': 'no-cache' },
                signal: AbortSignal.timeout(15000)
              });
              if (!response.ok) throw new Error(`Live Downloads page returned HTTP ${response.status}.`);
              if ((await response.text()) === expected) {
                core.notice(`Verified published Downloads page: ${url.origin}${url.pathname}`);
                return;
              }
              core.info(`Live Downloads page is not the generated page yet (attempt ${attempt}/18).`);
              if (attempt < 18) await new Promise(resolve => setTimeout(resolve, 10000));
            }
            throw new Error('Pages reported success, but the live Downloads page still differs from this deployment.');
